steps:
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'build'
      - '--build-arg'
      - 'NEXT_PUBLIC_API_URL=https://be-ksc-278881327745.asia-southeast1.run.app'
      - '-t'
      - 'asia-southeast1-docker.pkg.dev/ruangbumi/cloud-run-source-deploy/ksc-nextjs/ksc-nextjs:$COMMIT_SHA'
      - '.'

  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'push'
      - 'asia-southeast1-docker.pkg.dev/ruangbumi/cloud-run-source-deploy/ksc-nextjs/ksc-nextjs:$COMMIT_SHA'

  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    args:
      - 'run'
      - 'deploy'
      - 'ksc-nextjs'
      - '--image'
      - 'asia-southeast1-docker.pkg.dev/ruangbumi/cloud-run-source-deploy/ksc-nextjs/ksc-nextjs:$COMMIT_SHA'
      - '--region'
      - 'asia-southeast1'
      - '--set-env-vars'
      - 'NEXT_PUBLIC_API_URL=https://be-ksc-278881327745.asia-southeast1.run.app'

images:
  - 'asia-southeast1-docker.pkg.dev/ruangbumi/cloud-run-source-deploy/ksc-nextjs/ksc-nextjs:$COMMIT_SHA'

options:
  logging: CLOUD_LOGGING_ONLY
